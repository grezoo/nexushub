services:
  - type: web
    name: nexushub
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && python crawler/ai_curator.py
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
