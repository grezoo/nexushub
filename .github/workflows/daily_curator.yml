name: NexusHub Automated Nightly Curator

on:
  schedule:
    # Runs every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  curate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Quality Curator
        run: |
          python crawler/auto_curator.py

      - name: Commit and push updated catalogue & SQLite database
        run: |
          git config --global user.name "NexusHub Automated Curator"
          git config --global user.email "bot@nexushub.local"
          git add data/nexus.db data/catalogue.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(auto-curator): nightly update of quality open-source repositories [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi

