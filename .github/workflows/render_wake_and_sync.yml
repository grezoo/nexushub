name: OnRender Keep-Alive & AI Curator Sync

on:
  schedule:
    # Runs every 12 minutes to keep OnRender free tier awake (timeout is 15 min)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main ]

jobs:
  wake-and-curate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Ping & Wake Up OnRender Server
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://nexushub.onrender.com"
          fi
          echo "Sending keep-alive heartbeat ping to: $RENDER_URL"
          curl -s -m 15 -A "NexusHub-KeepAlive-Bot/1.0" "$RENDER_URL" > /dev/null || true
          echo "Keep-alive ping sent successfully!"
