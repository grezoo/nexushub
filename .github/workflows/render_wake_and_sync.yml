name: OnRender Keep-Alive Heartbeat

on:
  schedule:
    # Runs every 10 minutes to guarantee OnRender free tier never reaches the 15 min idle timeout
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches: [ main ]

jobs:
  wake-and-ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping & Wake Up OnRender Server
        run: |
          RENDER_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$RENDER_URL" ]; then
            RENDER_URL="https://gitcatalog.onrender.com"
          fi
          echo "Sending keep-alive heartbeat ping to: $RENDER_URL/ping"
          curl -s -m 25 --retry 3 --retry-delay 2 -A "NexusHub-KeepAlive-Bot/2.0" "$RENDER_URL/ping" || true
          curl -s -m 25 --retry 3 --retry-delay 2 -A "NexusHub-KeepAlive-Bot/2.0" "$RENDER_URL/health" || true
          echo "Keep-alive pings executed successfully!"

