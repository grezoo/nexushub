<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f1523"/>
      <stop offset="100%" stop-color="#1b1030"/>
    </linearGradient>

    <!-- Glowing Gradients -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Endless Smooth Horizontal Carousel Slide Animation */
      @keyframes slideTrack {
        0% { transform: translateX(0px); }
        50% { transform: translateX(-260px); }
        100% { transform: translateX(0px); }
      }

      /* Ambient Light Floating */
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
        50% { transform: translate(50px, -20px) scale(1.15); opacity: 0.4; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
        50% { transform: translate(-60px, 25px) scale(1.2); opacity: 0.35; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
      }

      /* Pulsing Play Aura */
      @keyframes pulseAura {
        0% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 0; }
        100% { transform: scale(1); opacity: 0.6; }
      }

      /* Equalizer / Audio Waves Animation */
      @keyframes waveBar {
        0%, 100% { height: 6px; }
        50% { height: 28px; }
      }

      /* Live Recording Dot Blinking */
      @keyframes liveBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .slide-anim-track {
        animation: slideTrack 10s ease-in-out infinite;
      }
      .orb-1 {
        animation: floatOrb1 7s ease-in-out infinite;
      }
      .orb-2 {
        animation: floatOrb2 8s ease-in-out infinite;
      }
      .pulse-ring {
        transform-origin: center;
        animation: pulseAura 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .live-dot {
        animation: liveBlink 1.2s infinite;
      }
      .w-bar1 { animation: waveBar 1.1s ease-in-out infinite; }
      .w-bar2 { animation: waveBar 0.8s ease-in-out 0.2s infinite; }
      .w-bar3 { animation: waveBar 1.3s ease-in-out 0.4s infinite; }
      .w-bar4 { animation: waveBar 0.9s ease-in-out 0.1s infinite; }
      .w-bar5 { animation: waveBar 1.4s ease-in-out 0.3s infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Moving Ambient Orbs in Background -->
  <circle cx="220" cy="140" r="160" fill="#a855f7" class="orb-1" filter="url(#glow)"/>
  <circle cx="620" cy="300" r="170" fill="#ec4899" class="orb-2" filter="url(#glow)"/>

  <!-- Top Glass Bar with Live Status -->
  <rect x="30" y="22" width="740" height="46" rx="23" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
  
  <!-- Live Recording Indicator -->
  <circle cx="58" cy="45" r="7" fill="#ef4444" class="live-dot"/>
  <text x="74" y="49" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" letter-spacing="1">LIVE DEMO STREAM</text>

  <!-- Filter Buttons Simulation -->
  <rect x="250" y="31" width="85" height="28" rx="14" fill="url(#purpleGrad)"/>
  <text x="270" y="49" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Top Gems</text>

  <rect x="345" y="31" width="95" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
  <text x="365" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Hardware</text>

  <rect x="450" y="31" width="85" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
  <text x="475" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">Audio</text>

  <rect x="545" y="31" width="85" height="28" rx="14" fill="rgba(255,255,255,0.08)"/>
  <text x="568" y="49" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="600">AI Video</text>

  <!-- Sound/Motion Visualizer Wave in Top Bar -->
  <g transform="translate(685, 45)">
    <rect x="0" y="-8" width="3" height="16" rx="1.5" fill="#34d399" class="w-bar1"/>
    <rect x="6" y="-12" width="3" height="24" rx="1.5" fill="#34d399" class="w-bar2"/>
    <rect x="12" y="-6" width="3" height="12" rx="1.5" fill="#34d399" class="w-bar3"/>
    <rect x="18" y="-14" width="3" height="28" rx="1.5" fill="#34d399" class="w-bar4"/>
    <rect x="24" y="-8" width="3" height="16" rx="1.5" fill="#34d399" class="w-bar5"/>
  </g>

  <!-- Shelf Headline with Motion Arrows -->
  <g transform="translate(35, 100)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" letter-spacing="-0.3">
      ▶ VIZUÁLIS KATALÓGUS — ÉLŐBEN MOZGÓ RÖVID DEMÓK
    </text>
    <rect x="470" y="-14" width="135" height="18" rx="9" fill="#10b981" opacity="0.25"/>
    <text x="482" y="-1" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="800">⚡ AUTOPLAY DEMO</text>
  </g>

  <!-- CLIP PATH TO PREVENT RAIL OVERFLOW -->
  <clipPath id="shelfClip">
    <rect x="30" y="115" width="740" height="315" rx="14"/>
  </clipPath>

  <!-- DYNAMIC MOVING SLIDER TRACK (Continuously slides left & right!) -->
  <g clip-path="url(#shelfClip)">
    <g class="slide-anim-track">
      
      <!-- CARD 1: AI Video & Talking Face -->
      <g transform="translate(35, 125)">
        <rect width="235" height="295" rx="14" fill="#0c111e" stroke="rgba(168,85,247,0.6)" stroke-width="1.8"/>
        <!-- Video Header Canvas -->
        <rect x="0" y="0" width="235" height="145" rx="14" fill="#181335"/>
        
        <!-- Animated Pulse Ring around Play -->
        <circle cx="117" cy="72" r="32" fill="none" stroke="#ec4899" stroke-width="3" class="pulse-ring"/>
        <circle cx="117" cy="72" r="24" fill="url(#purpleGrad)" filter="url(#glow)"/>
        <polygon points="113,62 127,72 113,82" fill="#ffffff"/>

        <!-- Animated Audio Wave in Video Canvas -->
        <g transform="translate(18, 115)">
          <rect x="0" y="-4" width="3" height="8" rx="1.5" fill="#a855f7" class="w-bar1"/>
          <rect x="5" y="-9" width="3" height="18" rx="1.5" fill="#ec4899" class="w-bar2"/>
          <rect x="10" y="-14" width="3" height="26" rx="1.5" fill="#c084fc" class="w-bar3"/>
          <rect x="15" y="-6" width="3" height="12" rx="1.5" fill="#ec4899" class="w-bar4"/>
          <rect x="20" y="-11" width="3" height="22" rx="1.5" fill="#a855f7" class="w-bar5"/>
        </g>

        <!-- Badge -->
        <rect x="10" y="10" width="75" height="20" rx="5" fill="#ec4899"/>
        <text x="17" y="24" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">▶ 15s DEMÓ</text>

        <!-- Card Body -->
        <rect x="14" y="160" width="60" height="14" rx="4" fill="#a855f7" opacity="0.3"/>
        <text x="18" y="170" fill="#c084fc" font-family="sans-serif" font-size="8" font-weight="800">FUNKCIÓ:</text>
        <text x="14" y="193" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">AI Videó Generálás</text>
        <text x="14" y="210" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">&amp; Beszélő Fejek</text>
        
        <text x="14" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Képből és hangból készít élethű</text>
        <text x="14" y="249" fill="#94a3b8" font-family="sans-serif" font-size="10">beszélő animációt kódolás nélkül.</text>

        <rect x="14" y="265" width="207" height="24" rx="7" fill="url(#purpleGrad)"/>
        <text x="85" y="281" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">Lejátszás ▶</text>
      </g>

      <!-- CARD 2: ESP32 Hardware Drone Controller -->
      <g transform="translate(290, 125)">
        <rect width="235" height="295" rx="14" fill="#0c111e" stroke="rgba(16,185,129,0.6)" stroke-width="1.8"/>
        <!-- Video Header Canvas -->
        <rect x="0" y="0" width="235" height="145" rx="14" fill="#052e24"/>
        
        <!-- Animated Pulse Ring around Play -->
        <circle cx="117" cy="72" r="32" fill="none" stroke="#10b981" stroke-width="3" class="pulse-ring"/>
        <circle cx="117" cy="72" r="24" fill="url(#emeraldGrad)" filter="url(#glow)"/>
        <polygon points="113,62 127,72 113,82" fill="#ffffff"/>

        <!-- NeoPixel Matrix Simulation Dots -->
        <g transform="translate(160, 20)">
          <circle cx="0" cy="0" r="4" fill="#34d399" class="live-dot"/>
          <circle cx="12" cy="0" r="4" fill="#06b6d4"/>
          <circle cx="24" cy="0" r="4" fill="#34d399"/>
          <circle cx="0" cy="12" r="4" fill="#10b981"/>
          <circle cx="12" cy="12" r="4" fill="#6ee7b7" class="live-dot"/>
          <circle cx="24" cy="12" r="4" fill="#10b981"/>
        </g>

        <!-- Badge -->
        <rect x="10" y="10" width="68" height="20" rx="5" fill="#10b981"/>
        <text x="17" y="24" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">💎 KINCS</text>

        <!-- Card Body -->
        <rect x="14" y="160" width="60" height="14" rx="4" fill="#10b981" opacity="0.3"/>
        <text x="18" y="170" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="800">FUNKCIÓ:</text>
        <text x="14" y="193" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">ESP32 WiFi Drón &amp;</text>
        <text x="14" y="210" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">LED Mátrix Vezérlő</text>

        <text x="14" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Telefonról irányítható mikro-drón</text>
        <text x="14" y="249" fill="#94a3b8" font-family="sans-serif" font-size="10">és sound-reactive LED effektek.</text>

        <rect x="14" y="265" width="207" height="24" rx="7" fill="url(#emeraldGrad)"/>
        <text x="85" y="281" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">Lejátszás ▶</text>
      </g>

      <!-- CARD 3: Demucs Audio Stem Separation -->
      <g transform="translate(545, 125)">
        <rect width="235" height="295" rx="14" fill="#0c111e" stroke="rgba(245,158,11,0.6)" stroke-width="1.8"/>
        <!-- Video Header Canvas -->
        <rect x="0" y="0" width="235" height="145" rx="14" fill="#351608"/>
        
        <!-- Animated Pulse Ring around Play -->
        <circle cx="117" cy="72" r="32" fill="none" stroke="#f59e0b" stroke-width="3" class="pulse-ring"/>
        <circle cx="117" cy="72" r="24" fill="url(#amberGrad)" filter="url(#glow)"/>
        <polygon points="113,62 127,72 113,82" fill="#ffffff"/>

        <!-- Animated Audio Wave in Video Canvas -->
        <g transform="translate(18, 115)">
          <rect x="0" y="-5" width="3" height="10" rx="1.5" fill="#f59e0b" class="w-bar3"/>
          <rect x="5" y="-12" width="3" height="24" rx="1.5" fill="#ef4444" class="w-bar1"/>
          <rect x="10" y="-16" width="3" height="32" rx="1.5" fill="#fbbf24" class="w-bar4"/>
          <rect x="15" y="-8" width="3" height="16" rx="1.5" fill="#f59e0b" class="w-bar2"/>
          <rect x="20" y="-14" width="3" height="28" rx="1.5" fill="#ef4444" class="w-bar5"/>
        </g>

        <!-- Badge -->
        <rect x="10" y="10" width="75" height="20" rx="5" fill="#ec4899"/>
        <text x="17" y="24" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">▶ 15s DEMÓ</text>

        <!-- Card Body -->
        <rect x="14" y="160" width="60" height="14" rx="4" fill="#f59e0b" opacity="0.3"/>
        <text x="18" y="170" fill="#fbbf24" font-family="sans-serif" font-size="8" font-weight="800">FUNKCIÓ:</text>
        <text x="14" y="193" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">AI Vokál &amp; Sávbontó</text>
        <text x="14" y="210" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Zenei Hangstúdió</text>

        <text x="14" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Bármely dalból külön veszi az éneket,</text>
        <text x="14" y="249" fill="#94a3b8" font-family="sans-serif" font-size="10">dobot, basszust és gitárt azonnal.</text>

        <rect x="14" y="265" width="207" height="24" rx="7" fill="url(#amberGrad)"/>
        <text x="85" y="281" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">Lejátszás ▶</text>
      </g>

      <!-- CARD 4: Stable Diffusion / Flux Fast Generation Studio -->
      <g transform="translate(800, 125)">
        <rect width="235" height="295" rx="14" fill="#0c111e" stroke="rgba(6,182,212,0.6)" stroke-width="1.8"/>
        <rect x="0" y="0" width="235" height="145" rx="14" fill="#0c2538"/>
        
        <circle cx="117" cy="72" r="32" fill="none" stroke="#06b6d4" stroke-width="3" class="pulse-ring"/>
        <circle cx="117" cy="72" r="24" fill="url(#cyanGrad)" filter="url(#glow)"/>
        <polygon points="113,62 127,72 113,82" fill="#ffffff"/>

        <rect x="10" y="10" width="75" height="20" rx="5" fill="#ec4899"/>
        <text x="17" y="24" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="900">▶ 15s DEMÓ</text>

        <rect x="14" y="160" width="60" height="14" rx="4" fill="#06b6d4" opacity="0.3"/>
        <text x="18" y="170" fill="#38bdf8" font-family="sans-serif" font-size="8" font-weight="800">FUNKCIÓ:</text>
        <text x="14" y="193" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">Valós Idejű AI Rajzoló</text>
        <text x="14" y="210" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="800">&amp; Képalkotó Stúdió</text>

        <text x="14" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Rajzolj firkákat, és az AI másodperc</text>
        <text x="14" y="249" fill="#94a3b8" font-family="sans-serif" font-size="10">töredéke alatt fotóvá alakítja élőben.</text>

        <rect x="14" y="265" width="207" height="24" rx="7" fill="url(#cyanGrad)"/>
        <text x="85" y="281" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800">Lejátszás ▶</text>
      </g>

    </g>
  </g>
</svg>
